server.port=8080
spring.application.name=CampusKhoj

# Session Management
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Logging
logging.level.com.campuskhoj=INFO
logging.level.org.springframework.security=WARN

# CampusKhoj Custom Configuration
campuskhoj.data.filepath=./data/items.dat
campuskhoj.seed.enabled=true
